name: Build and Deploy Vetiver API

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Setup R
      # -------------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          R -e "install.packages(c('vetiver','pins', 'tidyverse'))"

      # -------------------------
      # Build vetiver model + Docker assets
      # -------------------------
      - name: Build vetiver model and API
        run: |
          Rscript 9.deployment/vetiver_best_model.R

      # -------------------------
      # Commit changes to Repo
      # -------------------------
      - name: Commit generated vetiver files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git Dockerfile plumber.R vetiver_renv.lock 9.deployment/model_board/
          git commit -m 'Data updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
        env:
          REPO_KEY: ${{secrets.GITHUB_TOKEN}}
          username: github-actions

      # -------------------------
      # Docker setup
      # -------------------------
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # -------------------------
      # Build + Push image
      # -------------------------
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/depression-southafrica-api:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/depression-southafrica-api:latest
